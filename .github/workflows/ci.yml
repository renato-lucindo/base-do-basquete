name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed from zero
        run: npx --no-install supabase start -x studio,imgproxy,mailpit,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Verify season and division upgrade compatibility
        run: |
          npx --no-install supabase db reset --local --version 20261001185013 --sql-paths legacy-rollout-tests/season_division_upgrade.sql
          npx --no-install supabase migration up --local
          node scripts/verify-season-division-upgrade.mjs
          npx --no-install supabase db reset --local
      - name: Verify manual scheduling upgrade compatibility
        run: node scripts/test-manual-scheduling-upgrade.mjs
      - name: Run pgTAP database tests
        run: npx --no-install supabase test db --local
      - name: Verify preset concurrency on disposable database
        run: node scripts/test-preset-concurrency.mjs
      - name: Verify boxscore team-resolution concurrency on disposable database
        run: node scripts/test-boxscore-team-resolution-concurrency.mjs
      - name: Verify named RPC arguments through PostgREST
        run: node scripts/test-season-division-rpc-contract.mjs
