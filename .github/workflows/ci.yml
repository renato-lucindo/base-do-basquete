name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable email password login only in disposable GoTrue
        run: |
          sed -i '/^\[auth.email\]$/,/^\[auth.sms\]$/s/^enable_signup = false$/enable_signup = true/' supabase/config.toml
          grep -A 3 '^\[auth.email\]$' supabase/config.toml | grep -q 'enable_signup = true'
      - name: Apply migrations and seed from zero
        run: npx --no-install supabase start -x studio,imgproxy,mailpit,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Verify season and division upgrade compatibility
        run: |
          npx --no-install supabase db reset --local --version 20261001185013 --sql-paths legacy-rollout-tests/season_division_upgrade.sql
          npx --no-install supabase migration up --local
          node scripts/verify-season-division-upgrade.mjs
          npx --no-install supabase db reset --local
      - name: Verify divergent editions block consolidation
        run: |
          npx --no-install supabase db reset --local --version 20261005124828 --sql-paths legacy-rollout-tests/edition_identity_conflict.sql
          if npx --no-install supabase migration up --local > edition-identity-conflict.log 2>&1; then
            cat edition-identity-conflict.log
            echo "Expected edition identity consolidation to fail"
            exit 1
          fi
          cat edition-identity-conflict.log
          grep -q "BDB_EDITION_SHARED_DATA_CONFLICT" edition-identity-conflict.log
          npx --no-install supabase db reset --local
      - name: Verify manual scheduling upgrade compatibility
        run: node scripts/test-manual-scheduling-upgrade.mjs
      - name: Run pgTAP database tests
        run: npx --no-install supabase test db --local
      - name: Verify preset concurrency on disposable database
        run: node scripts/test-preset-concurrency.mjs
      - name: Verify boxscore team-resolution concurrency on disposable database
        run: node scripts/test-boxscore-team-resolution-concurrency.mjs
      - name: Verify named RPC arguments through PostgREST
        run: node scripts/test-season-division-rpc-contract.mjs
      - name: Install Chromium for authenticated disposable browser integration
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify GoTrue TOTP AAL2 and real browser FIBA fallback integration
        env:
          KEYBOARD_BROWSER_INTEGRATION: "true"
        run: node scripts/test-keyboard-disposable-integration.mjs
