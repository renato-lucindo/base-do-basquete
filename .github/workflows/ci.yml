name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed from zero
        run: npx --no-install supabase db start
      - name: Run pgTAP database tests
        run: npx --no-install supabase test db --local
      - name: Verify preset concurrency on disposable database
        run: node scripts/test-preset-concurrency.mjs
      - name: Verify boxscore team-resolution concurrency on disposable database
        run: node scripts/test-boxscore-team-resolution-concurrency.mjs
