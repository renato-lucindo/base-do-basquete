name: Bootstrap Worker deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      release_mode:
        description: Production release action
        required: true
        type: choice
        options:
          - deploy
          - upload-candidate
        default: deploy

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy preview
        if: github.event.inputs.environment == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/bdb-worker-secrets.json"
          npm run build
          node scripts/assert-worker-build-environment.mjs preview base-do-basquete-preview
          npx --no-install wrangler deploy --secrets-file "$RUNNER_TEMP/bdb-worker-secrets.json"
        env:
          CLOUDFLARE_ENV: preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Deploy production
        if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main' && github.event.inputs.release_mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/bdb-worker-secrets.json"
          npm run build
          node scripts/assert-worker-build-environment.mjs production base-do-basquete-prod
          npx --no-install wrangler deploy --secrets-file "$RUNNER_TEMP/bdb-worker-secrets.json" | tee production-output.log
          production_url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' production-output.log | tail -1)
          test -n "$production_url"
          printf 'PRODUCTION_URL=%s\n' "$production_url" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Upload production candidate
        if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main' && github.event.inputs.release_mode == 'upload-candidate'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-worker-secrets.mjs "$RUNNER_TEMP/bdb-worker-secrets.json"
          npm run build
          node scripts/assert-worker-build-environment.mjs production base-do-basquete-prod
          release_tag="release-${GITHUB_SHA:0:12}"
          npx --no-install wrangler versions upload --secrets-file "$RUNNER_TEMP/bdb-worker-secrets.json" --tag "$release_tag" --message "Production candidate ${GITHUB_SHA:0:12}"
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Smoke and measure production
        if: github.event.inputs.environment == 'production' && github.ref == 'refs/heads/main' && github.event.inputs.release_mode == 'deploy'
        run: |
          node scripts/smoke-release.mjs "$PRODUCTION_URL"
          node scripts/smoke-public-context.mjs "$PRODUCTION_URL"
          BENCHMARK_ALLOW_PRODUCTION=true node scripts/benchmark-public.mjs "$PRODUCTION_URL" 10
      - name: Remove ephemeral runtime secret file
        if: always()
        run: |
          node -e "require('node:fs').rmSync(process.argv[1], { force: true })" "$RUNNER_TEMP/bdb-worker-secrets.json"
